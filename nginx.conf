server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers and proxies must check with this server before they use a
    # saved copy. A new deploy then shows immediately.
    add_header Cache-Control "no-cache" always;

    location /subtitle/ {
        types { text/vtt vtt; }
    }
}
